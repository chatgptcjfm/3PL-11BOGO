server:
  address: 0.0.0.0
  port: ${PORT:3000}

spring:
  application:
    name: integration-process-bootstrap
  datasource:
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:integration_process_dev}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:integration_dev}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    com.example.integrationprocess: INFO
