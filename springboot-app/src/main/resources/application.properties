spring.application.name=integration-process-bootstrap
server.port=${PORT:3000}

spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/integration_process_dev?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:integration_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
